name: Compact appearance mobile QA

on:
  push:
    branches:
      - feature/mobile-compact-appearance
      - main
    paths:
      - index.html
      - appearance-compact.css
      - appearance-compact.js
      - market-data.js
      - gold-market.css
      - scripts/test-gold-market.cjs
      - scripts/test-market-data.cjs
      - scripts/test-compact-appearance.cjs
      - scripts/test-summary-tight-filters.cjs
      - scripts/test-control-alignment.cjs
      - .github/workflows/compact-appearance-mobile.yml
  pull_request:
    paths:
      - index.html
      - appearance-compact.css
      - appearance-compact.js
      - market-data.js
      - gold-market.css
      - scripts/test-gold-market.cjs
      - scripts/test-market-data.cjs
      - scripts/test-compact-appearance.cjs
      - scripts/test-summary-tight-filters.cjs
      - scripts/test-control-alignment.cjs
      - .github/workflows/compact-appearance-mobile.yml

permissions:
  contents: read

jobs:
  compact-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve exact feature files locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/compact-server.log 2>&1 &
      - name: Verify live HTML behavior at 3 viewport sizes
        env:
          APP_URL: http://127.0.0.1:8765/
        run: |
          mkdir -p screenshots
          node scripts/test-compact-appearance.cjs
          node scripts/test-summary-tight-filters.cjs
          node scripts/test-control-alignment.cjs
          node scripts/test-market-data.cjs
          node scripts/test-gold-market.cjs
          node scripts/test-mobile-appearance.cjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-appearance-mobile-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
