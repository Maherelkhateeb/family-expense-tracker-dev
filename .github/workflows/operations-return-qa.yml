name: Operations universal return QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - operations-return-hub.js
      - scripts/test-operations-return.cjs
      - .github/workflows/operations-return-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve application locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ops-return-app.log 2>&1 &
      - name: Verify reversible operations navigation on phones
        env:
          APP_URL: http://127.0.0.1:8765/
        run: node scripts/test-operations-return.cjs
