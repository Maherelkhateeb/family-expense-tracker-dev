name: Appearance engine regression
on:
  push:
    branches:
      - main
      - fix/appearance-palettes-20261116
    paths:
      - index.html
      - appearance-compact.js
      - scripts/test-appearance-presets.js
      - scripts/test-mobile-appearance.cjs
      - .github/workflows/mobile-appearance-live.yml
  pull_request:
    paths:
      - index.html
      - scripts/test-appearance-presets.js
      - scripts/test-mobile-appearance.cjs
      - .github/workflows/mobile-appearance-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appearance-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static appearance contract
        run: node scripts/test-appearance-presets.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated app server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/appearance-http.log 2>&1 &
      - name: Browser appearance checks
        env:
          APP_URL: http://127.0.0.1:8765/
        run: |
          mkdir -p screenshots
          node scripts/test-mobile-appearance.cjs
