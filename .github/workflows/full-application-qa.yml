name: Full application end-to-end QA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - family-alerts.js
      - voice-assistant-engine.js
      - budget-audit-engine.js
      - appearance-compact.js
      - market-data.js
      - gold-market.css
      - scripts/test-app-end-to-end.cjs
      - scripts/test-alert-time.cjs
      - .github/workflows/full-application-qa.yml
  pull_request:
    paths:
      - index.html
      - family-alerts.js
      - voice-assistant-engine.js
      - budget-audit-engine.js
      - appearance-compact.js
      - market-data.js
      - gold-market.css
      - scripts/test-app-end-to-end.cjs
      - scripts/test-alert-time.cjs
      - .github/workflows/full-application-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check family-alerts.js
          node --check voice-assistant-engine.js
          node --check budget-audit-engine.js
          node --check appearance-compact.js
          node --check market-data.js
          node --check scripts/test-app-end-to-end.cjs
          node --check scripts/test-alert-time.cjs
      - name: Install Chromium for isolated browser tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve unified application without private data
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/app-qa-server.log 2>&1 &
      - name: Verify every main navigation, notifications and task lifecycle
        env:
          APP_URL: http://127.0.0.1:8765/
        run: node scripts/test-app-end-to-end.cjs
      - name: Verify midnight and created-at Arabic notification timestamps
        env:
          APP_URL: http://127.0.0.1:8765/
        run: node scripts/test-alert-time.cjs
      - name: Verify one thousand financial records and reloads
        env:
          APP_URL: http://127.0.0.1:8765/
        run: node scripts/test-financial-1000.cjs
      - name: Verify Arabic voice transaction persistence
        env:
          APP_URL: http://127.0.0.1:8765/
        run: node scripts/test-voice-integration.cjs
      - name: Verify real cards and operations lists across modes
        env:
          APP_URL: http://127.0.0.1:8765/
        run: node scripts/test-card-list-design.cjs
      - name: Verify project budgets
        env:
          APP_URL: http://127.0.0.1:8765/
        run: node scripts/test-project-budget.cjs
      - name: Verify market feed, gold calculator and offline conditions
        env:
          APP_URL: http://127.0.0.1:8765/
        run: |
          node scripts/test-market-data.cjs
          node scripts/test-gold-market.cjs
