name: Unified application - 1000 transaction regression
on:
  push:
    branches: [main]
    paths:
      - index.html
      - budget-audit-engine.js
      - voice-assistant-engine.js
      - appearance-compact.js
      - scripts/test-financial-1000.cjs
      - scripts/test-voice-integration.cjs
      - scripts/test-card-list-design.cjs
      - .github/workflows/financial-1000-qa.yml
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - budget-audit-engine.js
      - voice-assistant-engine.js
      - appearance-compact.js
      - scripts/test-financial-1000.cjs
      - scripts/test-voice-integration.cjs
      - scripts/test-card-list-design.cjs
      - .github/workflows/financial-1000-qa.yml
permissions:
  contents: read
jobs:
  financial-1000:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run app server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/financial1000-app.log 2>&1 &
      - name: Test 1000 trial operations without touching user data
        env:
          APP_URL: http://127.0.0.1:8765/
        run: |
          node scripts/test-financial-1000.cjs
          node scripts/test-voice-integration.cjs
          node scripts/test-card-list-design.cjs
