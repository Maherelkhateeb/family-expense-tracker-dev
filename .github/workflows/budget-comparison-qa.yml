name: Budget Comparison Smoke Tests
on:
  push:
    paths:
      - "family-budget-comparison.js"
      - "budget-audit-engine.js"
      - "scripts/test-family-budget-comparison.cjs"
      - ".github/workflows/budget-comparison-qa.yml"
  workflow_dispatch:
jobs:
  comparison-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify comparison dashboard calculations and DOM rendering
        run: node scripts/test-family-budget-comparison.cjs
